@if (category(); as categoryValue) {
  <app-page-header
    [title]="categoryValue.name"
    [subtitle]="baseSubtitle()"
    [backLink]="['/base', listTypeId()]"
    backAriaLabel="Retour au modèle"
  >
    <button
      headerActions
      mat-icon-button
      class="touch-target"
      aria-label="Ajouter un produit"
      (click)="openCreateDialog()"
    >
      <mat-icon>add</mat-icon>
    </button>
  </app-page-header>

  <div class="page">
    @if (products$ | async; as products) {
      @if (products.length === 0) {
        <p class="empty-state empty-state--centered">Aucun produit dans cette catégorie.</p>
      } @else {
        <mat-list>
          @for (product of products; track product.id) {
            <mat-list-item>
              <span matListItemTitle>{{ product.name }}</span>
              <span matListItemMeta class="actions">
                <button mat-icon-button class="touch-target" aria-label="Modifier" (click)="openEditDialog(product)">
                  <mat-icon>edit</mat-icon>
                </button>
                <button mat-icon-button class="touch-target" aria-label="Supprimer" (click)="deleteProduct(product)">
                  <mat-icon>delete</mat-icon>
                </button>
              </span>
            </mat-list-item>
          }
        </mat-list>
      }
    }
  </div>
} @else {
  <app-page-header
    title="Catégorie introuvable"
    [backLink]="['/base', listTypeId()]"
    backAriaLabel="Retour au modèle"
  />
}
