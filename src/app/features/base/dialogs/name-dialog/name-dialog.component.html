<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
  <form [formGroup]="form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ data.label ?? 'Nom' }}</mat-label>
      <input matInput formControlName="name" [placeholder]="data.placeholder ?? ''" />
      @if (form.controls.name.hasError('required')) {
        <mat-error>Le nom est obligatoire</mat-error>
      }
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="dialogRef.close()">Annuler</button>
  <button mat-flat-button type="button" [disabled]="form.invalid" (click)="submit()">
    Enregistrer
  </button>
</mat-dialog-actions>
