<article class="session-card" [attr.data-session-id]="data().id">
  <button type="button" class="session-main" (click)="open.emit()">
    <p class="session-title">{{ data().name }}</p>
    <p class="session-date">
      {{ data().createdAt | date: 'd MMM y, HH:mm' }}
    </p>
    <p class="session-selected">
      @if (data().selectedCount === 0) {
        Aucun produit sélectionné
      } @else if (data().selectedCount === 1) {
        1 produit sélectionné
      } @else {
        {{ data().selectedCount }} produits sélectionnés
      }
    </p>
    <span class="session-status" [class]="data().status">
      @switch (data().status) {
        @case ('preparing') {
          Préparation
        }
        @case ('shopping') {
          En magasin
        }
        @case ('completed') {
          Terminée
        }
      }
    </span>
  </button>

  <div class="session-actions">
    <button
      type="button"
      mat-icon-button
      class="touch-target session-action"
      aria-label="Modifier"
      (click)="edit.emit(); $event.stopPropagation()"
    >
      <mat-icon>edit</mat-icon>
    </button>
    @if (data().status === 'preparing') {
      <button
        type="button"
        mat-icon-button
        class="touch-target session-action"
        aria-label="Passer en magasin"
        (click)="validate.emit(); $event.stopPropagation()"
      >
        <mat-icon>shopping_cart</mat-icon>
      </button>
    }
    @if (data().status === 'shopping') {
      <button
        type="button"
        mat-icon-button
        class="touch-target session-action"
        aria-label="Terminer les courses"
        (click)="complete.emit(); $event.stopPropagation()"
      >
        <mat-icon>done_all</mat-icon>
      </button>
    }
    <button
      type="button"
      mat-icon-button
      class="touch-target session-action session-action--danger"
      aria-label="Supprimer"
      (click)="remove.emit(); $event.stopPropagation()"
    >
      <mat-icon>delete</mat-icon>
    </button>
  </div>
</article>
