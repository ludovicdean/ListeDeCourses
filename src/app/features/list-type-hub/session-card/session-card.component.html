<article class="session-card" [attr.data-session-id]="data().id">
  <button type="button" class="session-main" (click)="open.emit()">
    <p class="session-title">{{ data().name }}</p>
    <p class="session-date">
      {{ data().createdAt | date: 'd MMM y, HH:mm' }}
    </p>
    <p class="session-selected">
      @if (data().selectedCount === 0) {
        Aucun produit sélectionné
      } @else if (data().selectedCount === 1) {
        1 produit sélectionné
      } @else {
        {{ data().selectedCount }} produits sélectionnés
      }
    </p>
    <span class="session-status" [class]="data().status">
      @switch (data().status) {
        @case ('preparing') {
          Préparation
        }
        @case ('shopping') {
          En magasin
        }
        @case ('completed') {
          Terminée
        }
      }
    </span>
  </button>

  <button
    type="button"
    mat-icon-button
    class="session-menu-trigger"
    [matMenuTriggerFor]="menu"
    aria-label="Actions de la session"
    (click)="$event.stopPropagation()"
  >
    <mat-icon>more_vert</mat-icon>
  </button>

  <mat-menu #menu="matMenu">
    <button mat-menu-item (click)="edit.emit()">
      <mat-icon>edit</mat-icon>
      <span>Modifier</span>
    </button>
    @if (data().status === 'preparing') {
      <button mat-menu-item (click)="validate.emit()">
        <mat-icon>shopping_cart</mat-icon>
        <span>Passer en magasin</span>
      </button>
    }
    @if (data().status === 'shopping') {
      <button mat-menu-item (click)="complete.emit()">
        <mat-icon>done_all</mat-icon>
        <span>Terminer les courses</span>
      </button>
    }
    <button mat-menu-item class="menu-item--danger" (click)="remove.emit()">
      <mat-icon>delete</mat-icon>
      <span>Supprimer</span>
    </button>
  </mat-menu>
</article>
